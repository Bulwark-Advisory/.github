<svg xmlns="http://www.w3.org/2000/svg" width="660" height="390" viewBox="0 0 660 390">
<rect x="1" y="1" width="658" height="388" rx="24" fill="#FFFFFF" stroke="#D7E7F5"/>
<text x="30" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#10254A">How we work</text>
<text x="30" y="67" font-family="Arial,sans-serif" font-size="13" fill="#65798C">Evidence first. Decisions second. Progress that can scale.</text>
<g font-family="Arial,sans-serif">
<line x1="64" y1="105" x2="64" y2="346" stroke="#B9D4EA" stroke-width="2"/>
<g><circle cx="64" cy="118" r="18" fill="#E8F3FF" stroke="#8FBAE8"/><text x="64" y="123" text-anchor="middle" font-size="12" font-weight="800" fill="#0B6CF2">01</text><text x="102" y="116" font-size="17" font-weight="800" fill="#10254A">Discover</text><text x="102" y="138" font-size="13.5" fill="#65798C">Product, architecture, constraints, goals.</text></g>
<g><circle cx="64" cy="174" r="18" fill="#E8F3FF" stroke="#8FBAE8"/><text x="64" y="179" text-anchor="middle" font-size="12" font-weight="800" fill="#0B6CF2">02</text><text x="102" y="172" font-size="17" font-weight="800" fill="#10254A">Review</text><text x="102" y="194" font-size="13.5" fill="#65798C">Evidence, controls, attack paths, gaps.</text></g>
<g><circle cx="64" cy="230" r="18" fill="#E8F8F5" stroke="#77CDBD"/><text x="64" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#1A8E77">03</text><text x="102" y="228" font-size="17" font-weight="800" fill="#10254A">Prioritize</text><text x="102" y="250" font-size="13.5" fill="#65798C">Risk × effort × product context.</text></g>
<g><circle cx="64" cy="286" r="18" fill="#E8F8F5" stroke="#77CDBD"/><text x="64" y="291" text-anchor="middle" font-size="12" font-weight="800" fill="#1A8E77">04</text><text x="102" y="284" font-size="17" font-weight="800" fill="#10254A">Enable</text><text x="102" y="306" font-size="13.5" fill="#65798C">Guidance, templates, remediation support.</text></g>
<g><circle cx="64" cy="342" r="18" fill="#E8F8F5" stroke="#77CDBD"/><text x="64" y="347" text-anchor="middle" font-size="12" font-weight="800" fill="#1A8E77">05</text><text x="102" y="340" font-size="17" font-weight="800" fill="#10254A">Scale</text><text x="102" y="362" font-size="13.5" fill="#65798C">Measure, operationalize, sustain.</text></g>
</g>
</svg>
